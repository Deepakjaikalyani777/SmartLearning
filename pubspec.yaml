# pubspec.yaml  ≈  build.gradle (dependencies) + AndroidManifest (app name/version)
name: flutter_learning_app
description: "A learn-by-example Flutter app for Android developers."
publish_to: 'none'

# version: <versionName>+<versionCode>   (1.0.0 -> versionName, 1 -> versionCode)
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2            # State management  ≈ ViewModel + LiveData
  http: ^1.2.2                # Networking         ≈ Retrofit / OkHttp
  shared_preferences: ^2.3.2  # Key-value storage  ≈ SharedPreferences / DataStore

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # assets  ≈  res/drawable, res/raw, assets/
  assets:
    - assets/images/
